[package]
name = "mangania"
version = "0.1.13"
edition = "2024"

[dependencies]
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = "0.4.8"
toml = "1.2.1"
winit = "0.30.12"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSCell", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSString"] }

[target.'cfg(not(windows))'.dependencies]
dirs = "7.0.0"

[build-dependencies]
resvg = { version = "0.50.0", default-features = false }
winresource = "0.1.34"
