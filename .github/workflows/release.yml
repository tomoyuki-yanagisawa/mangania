name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/mangania.exe" dist/
          Copy-Item "README.md" dist/
          $archive = "mangania-v${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $archive

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/mangania dist/
          cp README.md dist/
          platform="${{ matrix.platform }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            platform="macos-$(uname -m)"
          fi
          tar -czf "mangania-v${{ needs.version.outputs.version }}-${platform}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: mangania-${{ matrix.platform }}
          path: |
            mangania-v${{ needs.version.outputs.version }}-*.zip
            mangania-v${{ needs.version.outputs.version }}-*.tar.gz
          if-no-files-found: error

  build-win7:
    name: Build (windows7-x86_64)
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows7-x86_64

      - name: Build
        run: cargo build --release --locked -Z build-std --target x86_64-win7-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-win7-windows-msvc/release/mangania.exe" dist/
          Copy-Item "README.md" dist/
          $archive = "mangania-v${{ needs.version.outputs.version }}-windows7-x86_64.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $archive

      - uses: actions/upload-artifact@v4
        with:
          name: mangania-windows7-x86_64
          path: mangania-v${{ needs.version.outputs.version }}-windows7-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - version
      - build
      - build-win7
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty=format:"- %s" "$range"
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          gh release create "$tag" artifacts/* \
            --title "$tag" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
